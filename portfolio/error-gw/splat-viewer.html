<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="generator" content="Claude (Anthropic) — このビューワーのコードはAIによって生成されました">
<title>Splat Viewer</title>
<!--
  ============================================================
  このビューワーのコードは Claude (Anthropic) によって生成されました。
  3Dモデル（.splatデータ）そのものは制作者本人によるものです。
  ============================================================
-->

<style>
  :root { --fg:#e8e8ea; --dim:#8b8b93; --accent:#6fb3ff; --warn:#ffc46f; --err:#ff8080; }
  * { box-sizing:border-box; }
  html,body{ margin:0; height:100%; overflow:hidden; background:#0b0b0d; color:var(--fg);
    font-family:ui-monospace,SFMono-Regular,Menlo,"SF Mono",monospace; -webkit-font-smoothing:antialiased; }
  canvas{ display:block; }

  #hud{ position:fixed; left:16px; top:16px; z-index:10; font-size:11px; line-height:1.6;
    color:var(--dim); pointer-events:none; text-shadow:0 1px 2px rgba(0,0,0,.8); }
  #hud b{ color:var(--fg); font-weight:500; }

  #overlay{ position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:16px; background:#0b0b0d; text-align:center; padding:24px; transition:opacity .4s; }
  #overlay.hidden{ opacity:0; pointer-events:none; }
  #overlay.drop{ outline:1px dashed var(--accent); outline-offset:-16px; }

  #title{ font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--dim); }
  #msg{ font-size:13px; max-width:44em; line-height:1.8; white-space:pre-wrap; }
  #msg code{ color:var(--accent); }
  #msg.error{ color:var(--err); }

  #bar{ width:min(320px,70vw); height:1px; background:#26262b; position:relative; overflow:hidden; }
  #bar > i{ position:absolute; inset:0 100% 0 0; background:var(--fg); transition:right .2s; }

  #stat{ font-size:11px; color:var(--dim); font-variant-numeric:tabular-nums; line-height:1.9; }
  #stat .k{ color:#55555c; }
  #clock{ color:var(--accent); }
  #diag{ font-size:11px; color:var(--warn); max-width:44em; line-height:1.8; white-space:pre-wrap; }

  /* ── AI生成クレジット ── */
  #credit{
    position:fixed; right:16px; bottom:16px; z-index:30;
    display:flex; align-items:center; gap:8px;
    padding:7px 11px; border-radius:999px;
    background:rgba(255, 255, 255, 0.72); backdrop-filter:blur(8px);
    font-size:10px; letter-spacing:.08em; color:black;
    text-decoration:none; line-height:1;
    transition:color .2s, border-color .2s;
  }
  #credit:hover{ color:gray; border-color:#3d3d46; }
  #credit .dot{
    width:5px; height:5px; border-radius:50%; background:var(--accent);
    flex:none; opacity:.9;
  }
  #credit .sep{ color:#3d3d46; }
  #credit .who{ color:#2c2c2e; }
  /* 公式ロゴを差し込んだ場合のサイズ調整 */
  #credit-logo{ display:none; height:13px; width:auto; flex:none; }
  #credit-logo[data-filled]{ display:block; }
  @media (max-width:520px){ #credit .sep, #credit .long{ display:none; } }
</style>
</head>
<body>

<div id="hud" hidden>
  <div><b id="hud-name"></b></div>
  <div id="hud-info"></div>
  <div>drag: rotate / right-drag: pan / wheel: zoom</div>
</div>

<div id="overlay">
  <div id="title">Splat Viewer</div>
  <div id="msg">initializing…</div>
  <div id="bar"><i></i></div>
  <div id="stat"></div>
  <div id="diag"></div>
</div>

<!--
  AI生成クレジット。
  公式ロゴを表示したい場合は、下の #credit-logo の中に
  Anthropic公式サイト (anthropic.com) で配布されている Claude のロゴSVGを
  そのまま貼り付けてください（ブランドガイドラインの範囲内で使用のこと）。
  空のままなら、テキストのみのクレジットとして表示されます。
  クレジット自体を消す場合は ?credit=0
-->
<a id="credit" href="https://www.anthropic.com/claude" target="_blank" rel="noopener noreferrer"
   title="このビューワーのコードはClaudeによって生成されました">
   <span>VIEWER GENERATED BY</span>
  <span id="credit-logo"><img style="height: 100%;" src="https://upload.wikimedia.org/wikipedia/commons/8/8a/Claude_AI_logo.svg?utm_source=ja.wikipedia.org&utm_campaign=index&utm_content=original" alt=""></span>
  <span class="dot" aria-hidden="true"></span>
  <span class="sep">/</span>
  <span class="long">ANTHROPIC</span>
</a>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as GaussianSplats3D from 'https://cdn.jsdelivr.net/npm/@mkkellogg/gaussian-splats-3d@0.4.7/build/gaussian-splats-3d.module.js';

const STAGE = GaussianSplats3D.LoaderStatus || { Downloading:0, Processing:1, Done:2 };
const FMT   = GaussianSplats3D.SceneFormat  || { Splat:0, KSplat:1, Ply:2 };

const $ = (s) => document.querySelector(s);
const overlay=$('#overlay'), msg=$('#msg'), bar=$('#bar > i'), stat=$('#stat'), diag=$('#diag'), hud=$('#hud');
const qs = new URLSearchParams(location.search);

/* ───────── パラメータ ───────── */
function pickFile(){
  for (const k of ['file','model','url','src']) { const v=qs.get(k); if (v) return v; }
  for (const [k,v] of qs.entries()) if (!v && /\.(splat|ksplat|ply)$/i.test(k)) return k;
  return null;
}
const num  = (k,d)=>{ const v=parseFloat(qs.get(k)); return Number.isFinite(v)?v:d; };
const bool = (k,d)=>{ const v=qs.get(k); return v===null?d:!/^(0|false|no|off)$/i.test(v); };
const vec  = (k,d)=>{ const v=qs.get(k); if(!v) return d; const a=v.split(',').map(Number);
                      return a.length===3&&a.every(Number.isFinite)?a:d; };

const opts = {
  up:vec('up',[0,-1,0]), pos:vec('pos',[0,1,4]), lookAt:vec('lookat',[0,0,0]),
  bg:qs.get('bg')||'#0b0b0d',
  sh:Math.min(2,Math.max(0,num('sh',0))),
  alphaMin:num('alpha',5),
  antialias:bool('aa',false),
  pointCloud:bool('points',false),
  // 既定を false に変更。progressive load は非 cross-origin-isolated 環境だと
  // チャンクごとにメインスレッドでバッファ再構築が走り、大きいファイルで固まりやすい
  progressive:bool('progressive',false),
  shared:bool('shared',false),
  preflight:bool('preflight',true),
};

/* ───────── AI生成クレジット ───────── */
(function initCredit(){
  const el = $('#credit');
  if (!bool('credit', true)) { el.remove(); return; }
  // ロゴSVGが差し込まれていれば表示し、代わりのドットを隠す
  const logo = $('#credit-logo');
  if (logo && logo.children.length > 0) {
    logo.setAttribute('data-filled', '');
    el.querySelector('.dot')?.remove();
  }
})();

/* ───────── URL / 形式 ───────── */
function resolve(name){
  if (/^https?:\/\//i.test(name)) return name;
  if (/^[a-z][a-z0-9+.-]*:/i.test(name)) throw new Error('対応していないURLスキームです');
  const clean = name.replace(/^[\/\\]+/,'').split('/').filter(s=>s!=='..'&&s!=='.').join('/');
  return new URL(clean, location.href.replace(/[^/]*$/,'')).href;
}
function extOf(name){ return (name.split('?')[0].match(/\.([a-z0-9]+)$/i)||[])[1]?.toLowerCase(); }
function formatOf(name){
  const e = extOf(name);
  return e==='splat'?FMT.Splat : e==='ksplat'?FMT.KSplat : e==='ply'?FMT.Ply : null;
}
const mb = (b)=> (b/1048576).toFixed(1)+' MB';

/* ───────── UI ───────── */
function setMsg(t,isErr=false){ msg.textContent=t; msg.classList.toggle('error',isErr);
  overlay.classList.remove('hidden'); if(isErr){ bar.style.right='100%'; stopClock(); } }
function setProgress(p){ bar.style.right=(100-Math.max(0,Math.min(100,p)))+'%'; }
function setDiag(t){ diag.textContent=t||''; }

/* メインスレッドが生きているかを示すカウンタ。
   ここが止まった＝JSのメインスレッドがブロックされている、という切り分けに使う */
let clockRAF=null, t0=0, lastStage='—', lastPct=0;
function renderStat(){
  const el = ((performance.now()-t0)/1000).toFixed(1);
  stat.innerHTML =
    `<span class="k">elapsed</span> <span id="clock">${el}s</span>　` +
    `<span class="k">stage</span> ${lastStage}　` +
    `<span class="k">progress</span> ${lastPct.toFixed(0)}%`;
}
function startClock(){ t0=performance.now(); const tick=()=>{ renderStat(); clockRAF=requestAnimationFrame(tick); }; tick(); }
function stopClock(){ if(clockRAF) cancelAnimationFrame(clockRAF); clockRAF=null; }

/* 一定時間 progress が動かない場合のヒント表示（ネットワーク停滞の検出） */
let watchdog=null, lastMove=0;
function kickWatchdog(){
  lastMove = performance.now();
  if (watchdog) return;
  watchdog = setInterval(()=>{
    if (performance.now()-lastMove > 20000) {
      setDiag('20秒以上 progress が動いていません。\n' +
              'elapsed が進んでいるならネットワーク側の停滞、\n' +
              'elapsed も止まっているならメインスレッドがブロックされています。');
    }
  }, 2000);
}
function clearWatchdog(){ if(watchdog) clearInterval(watchdog); watchdog=null; }

function usage(){
  overlay.innerHTML =
    '<div id="title">Splat Viewer</div>' +
    '<div id="msg">ファイルが指定されていません。\n\n' +
    '<code>?file=model.splat</code> のようにクエリで指定するか、\n' +
    '.splat / .ksplat / .ply をこの画面にドロップしてください。</div>';
}

/* ───────── プリフライト（HEADでサイズと配信設定を確認） ───────── */
async function preflight(url, ext){
  const info = { bytes:null, encoding:null, type:null, splats:null, warn:[] };
  try {
    const r = await fetch(url, { method:'HEAD' });
    if (!r.ok) { info.warn.push(`HEAD ${r.status} — ファイルが存在しない可能性`); return info; }
    info.bytes    = parseInt(r.headers.get('content-length')||'', 10) || null;
    info.encoding = r.headers.get('content-encoding');
    info.type     = r.headers.get('content-type');
  } catch (e) {
    info.warn.push('HEADに失敗（CORSかネットワーク）: ' + e.message);
    return info;
  }

  if (ext === 'splat' && info.bytes) {
    // .splat は 1スプラット = 32バイト固定（pos12 + scale12 + color4 + rot4）
    if (info.bytes % 32 !== 0) {
      info.warn.push(`ファイルサイズが32の倍数ではありません（${info.bytes} bytes）。\n` +
                     '.splat として壊れているか、サーバーが圧縮/改変して返しています。');
    }
    info.splats = Math.floor(info.bytes / 32);
  }

  if (info.encoding && /gzip|br|deflate/i.test(info.encoding)) {
    info.warn.push(`Content-Encoding: ${info.encoding} が付いています。\n` +
                   '.splat をサーバー側で圧縮すると Content-Length が実サイズと食い違い、\n' +
                   'ローダーが誤った長さで読み込んで停止することがあります。除外設定を推奨。');
  }
  if (info.splats && info.splats > 4_000_000) {
    info.warn.push(`約 ${(info.splats/1e6).toFixed(1)}M スプラット。\n` +
                   'ブラウザのメモリとソート負荷の上限に近く、ビルド中に固まる可能性があります。\n' +
                   '.ksplat への変換か、学習側でのスプラット数削減を推奨。');
  }
  return info;
}

/* ───────── 読み込み ───────── */
let viewer = null;

async function load(url, displayName, format, ext){
  if (viewer){ try { await viewer.dispose(); } catch(e){} viewer=null; }

  overlay.classList.remove('hidden');
  setDiag('');
  lastStage='—'; lastPct=0;
  startClock();
  setMsg('preflight ' + displayName);

  let info = null;
  if (opts.preflight && /^https?:/i.test(url)) {
    info = await preflight(url, ext);
    console.groupCollapsed('%c[splat-viewer] preflight', 'color:#6fb3ff');
    console.log('url       :', url);
    console.log('bytes     :', info.bytes, info.bytes ? '(' + mb(info.bytes) + ')' : '');
    console.log('splats    :', info.splats);
    console.log('type      :', info.type);
    console.log('encoding  :', info.encoding);
    console.log('options   :', opts);
    console.groupEnd();
    if (info.warn.length) setDiag(info.warn.join('\n\n'));
  }

  const sizeLine = info?.bytes
    ? `${mb(info.bytes)}${info.splats ? ` / ${(info.splats/1e6).toFixed(2)}M splats` : ''}`
    : '';
  setMsg(`loading ${displayName}${sizeLine ? '\n' + sizeLine : ''}`);

  viewer = new GaussianSplats3D.Viewer({
    cameraUp: opts.up,
    initialCameraPosition: opts.pos,
    initialCameraLookAt: opts.lookAt,
    sharedMemoryForWorkers: opts.shared,
    sphericalHarmonicsDegree: opts.sh,
    antialiased: opts.antialias,
    pointCloudMode: opts.pointCloud,
    showLoadingUI: false,
    useBuiltInControls: true,
    dynamicScene: false,
  });
  viewer.renderer.setClearColor(opts.bg, 1);

  const canProgressive = opts.progressive && format !== FMT.Ply;
  kickWatchdog();

  await viewer.addSplatScene(url, {
    format: format ?? undefined,
    splatAlphaRemovalThreshold: opts.alphaMin,
    progressiveLoad: canProgressive,
    showLoadingUI: false,
    onProgress: (percent, percentLabel, stage) => {
      try {
        lastPct = Number(percent) || 0;
        setProgress(lastPct);
        kickWatchdog();
        if (stage === STAGE.Processing) { lastStage='processing'; setMsg(`processing ${displayName}\nデータ展開中。ここはメインスレッドを長時間ブロックします。`); }
        else if (stage === STAGE.Downloading) { lastStage='downloading'; }
        else if (stage === STAGE.Done) { lastStage='done'; }
      } catch (e) { console.warn('[splat-viewer] onProgress error (無視):', e); }
    },
  });

  clearWatchdog();
  viewer.start();
  stopClock();

  $('#hud-name').textContent = displayName;
  $('#hud-info').textContent = sizeLine;
  hud.hidden = false;
  overlay.classList.add('hidden');
}

function fail(e, name){
  clearWatchdog(); stopClock();
  console.error('[splat-viewer]', e);
  setMsg(`読み込みに失敗しました: ${name||''}\n${(e && (e.message||e))||'unknown error'}\n\n` +
    '確認:\n・ファイル名とパス\n・別ドメインならCORS\n・形式が .splat / .ksplat / .ply か', true);
}

(async () => {
  const name = pickFile();
  if (!name){ usage(); return; }
  let url; try { url = resolve(name); } catch(e){ return fail(e, name); }
  try { await load(url, name.split('/').pop(), formatOf(name), extOf(name)); }
  catch(e){ fail(e, name); }
})();

/* ───────── ドラッグ&ドロップ ───────── */
addEventListener('dragover', e=>{ e.preventDefault(); overlay.classList.add('drop'); });
addEventListener('dragleave', ()=> overlay.classList.remove('drop'));
addEventListener('drop', async e=>{
  e.preventDefault(); overlay.classList.remove('drop');
  const f = e.dataTransfer.files[0]; if(!f) return;
  const fmt = formatOf(f.name);
  if (fmt===null) return setMsg('対応していない形式です: '+f.name, true);
  const objURL = URL.createObjectURL(f);
  try { await load(objURL, f.name, fmt, extOf(f.name)); }
  catch(err){ fail(err, f.name); }
});

/* WebGLコンテキスト喪失の検出（メモリ不足時によく起きる） */
addEventListener('webglcontextlost', (e)=>{
  e.preventDefault();
  fail(new Error('WebGLコンテキストが失われました（GPUメモリ不足の可能性が高い）'), 'context');
}, true);
</script>
</body>
</html>
